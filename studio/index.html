<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bar Chart Race Studio</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Garet Font -->
  <link href="https://fonts.cdnfonts.com/css/garet" rel="stylesheet" />

  <!-- React & ReactDOM (UMD) + Babel -->
  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #020617;
      color: #e2e8f0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    /* Özel Kaydırma Çubuğu */
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(71, 85, 105, 0.8);
      border-radius: 8px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 1);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.2s ease-out forwards;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;
    // Headless render mode: the factory injects window.__RENDER_CONFIG__ and steps frames via window.__seek
    const RENDER_MODE = !!window.__RENDER_CONFIG__;
    // Titles are English in production; lang="tr" would uppercase i as İ (PREMİER)
    if (RENDER_MODE) document.documentElement.lang = 'en';

    const App = () => {
      // Varsayılan 4 Oyuncu
      const initialPlayers = {
        p1: {
          name: 'Messi',
          logo: 'https://upload.wikimedia.org/wikipedia/tr/thumb/4/43/FC_Barcelona.svg/800px-FC_Barcelona.svg.png',
          image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/Lionel-Messi-Argentina-2022-FIFA-World-Cup_%28cropped%29.jpg/800px-Lionel-Messi-Argentina-2022-FIFA-World-Cup_%28cropped%29.jpg',
          color: '#2563eb'
        },
        p2: {
          name: 'Ronaldo',
          logo: 'https://upload.wikimedia.org/wikipedia/tr/thumb/9/98/Real_Madrid.svg/800px-Real_Madrid.svg.png',
          image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d7/Cristiano_Ronaldo_playing_for_Al_Nassr_FC_against_Persepolis%2C_September_2023_%28cropped%29.jpg/800px-Cristiano_Ronaldo_playing_for_Al_Nassr_FC_against_Persepolis%2C_September_2023_%28cropped%29.jpg',
          color: '#dc2626'
        },
        p3: {
          name: 'Mbappe',
          logo: 'https://upload.wikimedia.org/wikipedia/tr/thumb/9/98/Real_Madrid.svg/800px-Real_Madrid.svg.png',
          image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/57/2019-07-17_SG_Dynamo_Dresden_vs._Paris_Saint-Germain_by_Sandro_Halank%E2%80%93129_%28cropped%29.jpg/800px-2019-07-17_SG_Dynamo_Dresden_vs._Paris_Saint-Germain_by_Sandro_Halank%E2%80%93129_%28cropped%29.jpg',
          color: '#0284c7'
        },
        p4: {
          name: 'Lewandowski',
          logo: 'https://upload.wikimedia.org/wikipedia/tr/thumb/4/43/FC_Barcelona.svg/800px-FC_Barcelona.svg.png',
          image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/c/c4/Robert_Lewandowski_2022_%28cropped%29.jpg/800px-Robert_Lewandowski_2022_%28cropped%29.jpg',
          color: '#9f1239'
        }
      };

      // Varsayılan 7 Yıl (2020 - 2026)
      const generateDefaultData = () => {
        const years = ['2020', '2021', '2022', '2023', '2024', '2025', '2026'];
        const presetScores = [
          { p1: 31, p2: 37, p3: 27, p4: 45 },
          { p1: 38, p2: 36, p3: 42, p4: 48 },
          { p1: 35, p2: 24, p3: 54, p4: 42 },
          { p1: 28, p2: 54, p3: 52, p4: 33 },
          { p1: 30, p2: 43, p3: 44, p4: 40 },
          { p1: 26, p2: 39, p3: 48, p4: 36 },
          { p1: 25, p2: 35, p3: 50, p4: 34 }
        ];
        return years.map((year, idx) => ({
          label: year,
          ...presetScores[idx]
        }));
      };

      const [activeTab, setActiveTab] = useState('genel');

      const [headerTitle, setHeaderTitle] = useState('DÜNYA FUTBOLU');
      const [headerSubtitle, setHeaderSubtitle] = useState('GOL KRALLIĞI (2020 - 2026)');
      const [players, setPlayers] = useState(initialPlayers);
      const [statsData, setStatsData] = useState(generateDefaultData);
      const [isPlaying, setIsPlaying] = useState(false);
      const [simTime, setSimTime] = useState(0);
      const [duration, setDuration] = useState(18);
      const [transitionSpeed, setTransitionSpeed] = useState(0.45);
      const [barScale, setBarScale] = useState(200.0);

      const [maxPlayers, setMaxPlayers] = useState(4);
      const [uiScale, setUiScale] = useState(1.0);
      const [verticalGap, setVerticalGap] = useState(25);

      const [globalShiftX, setGlobalShiftX] = useState(0);
      const [globalShiftY, setGlobalShiftY] = useState(0);
      const [lLineHorizontalExtension, setLLineHorizontalExtension] = useState(0);
      const [lLineVerticalExtension, setLLineVerticalExtension] = useState(0);
      const [lLineOpacity, setLLineOpacity] = useState(0.8);
      const [lShadowOpacity, setLShadowOpacity] = useState(0.25);

      const [showImg1, setShowImg1] = useState(true);
      const [logoSize, setLogoSize] = useState(46);
      const [logoX, setLogoX] = useState(0);
      const [logoRadius, setLogoRadius] = useState(0);

      const [showImg2, setShowImg2] = useState(true);
      const [profileSize, setProfileSize] = useState(46);
      const [profileX, setProfileX] = useState(0);
      const [profileRadius, setProfileRadius] = useState(50);
      const [profilePopout, setProfilePopout] = useState(35);

      const [isDynamicBar, setIsDynamicBar] = useState(true);
      const [barBaseWidth, setBarBaseWidth] = useState(50);
      const [barHeightSet, setBarHeightSet] = useState(32);
      const [barSpacing, setBarSpacing] = useState(28);
      const [scoreSize, setScoreSize] = useState(20);
      const [scoreColor, setScoreColor] = useState('#fef08a');

      const [lineThickness, setLineThickness] = useState(2);
      const [lineColor, setLineColor] = useState('#ffffff');
      const [lineOpacity, setLineOpacity] = useState(0.3);

      const [bubbleBgColor, setBubbleBgColor] = useState('#ffffff');
      const [bubbleTextColor, setBubbleTextColor] = useState('#0f172a');
      const [bubbleWidth, setBubbleWidth] = useState(32);
      const [bubbleHeight, setBubbleHeight] = useState(24);
      const [bubbleFontSize, setBubbleFontSize] = useState(11);
      const [bubbleBaseOpacity, setBubbleBaseOpacity] = useState(1.0);

      const [yearBgColor, setYearBgColor] = useState('#ffffff');
      const [yearTextColor, setYearTextColor] = useState('#ffffff');
      const [yearBgOpacity, setYearBgOpacity] = useState(0.1);
      const [yearBorderRadius, setYearBorderRadius] = useState(9999);
      const [yearImage, setYearImage] = useState('');
      const [yearImgSize, setYearImgSize] = useState(24);
      const [yearImgPos, setYearImgPos] = useState('left');
      const [yearImgGap, setYearImgGap] = useState(8);
      const [yearImgShiftX, setYearImgShiftX] = useState(0);
      const [yearImgShiftY, setYearImgShiftY] = useState(0);
      const [yearFontSize, setYearFontSize] = useState(18);
      const [yearPaddingX, setYearPaddingX] = useState(16);
      const [yearPaddingY, setYearPaddingY] = useState(4);

      const [bgType, setBgType] = useState('gradient');
      const [bgColor1, setBgColor1] = useState('#2563eb');
      const [bgColor2, setBgColor2] = useState('#1e3a8a');
      const [bgMedia, setBgMedia] = useState('');
      const [bgMediaType, setBgMediaType] = useState('none');

      const [aiPrompt, setAiPrompt] = useState('');
      const [apiKey, setApiKey] = useState('');
      const [isAiLoading, setIsAiLoading] = useState(false);
      const [aiResultMsg, setAiResultMsg] = useState('');
      const [aiError, setAiError] = useState('');

      const [savedSettings, setSavedSettings] = useState(() => {
        try {
          const saved = localStorage.getItem('barChartSettings');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });
      const [showSavePopup, setShowSavePopup] = useState(false);
      const [saveName, setSaveName] = useState('');
      const [showClearConfirm, setShowClearConfirm] = useState(false);
      const [isFullscreen, setIsFullscreen] = useState(false);
      const [idbStatus, setIdbStatus] = useState('Bağlanıyor...');

      // --- INDEXEDDB VERİTABANI MOTORU (BarChartStudioDB) ---
      const IDB_NAME = 'BarChartStudioDB';
      const IDB_VERSION = 1;
      const STORE_PRESETS = 'presets';
      const STORE_WORKSPACE = 'workspace';

      const openStudioDB = () => {
        return new Promise((resolve, reject) => {
          if (typeof window === 'undefined' || !window.indexedDB) {
            reject(new Error('IndexedDB desteklenmiyor'));
            return;
          }
          const request = window.indexedDB.open(IDB_NAME, IDB_VERSION);
          request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(STORE_PRESETS)) {
              db.createObjectStore(STORE_PRESETS, { keyPath: 'id' });
            }
            if (!db.objectStoreNames.contains(STORE_WORKSPACE)) {
              db.createObjectStore(STORE_WORKSPACE, { keyPath: 'id' });
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      };

      const idbGetAll = async (storeName) => {
        const db = await openStudioDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, 'readonly');
          const store = tx.objectStore(storeName);
          const req = store.getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => reject(req.error);
        });
      };

      const idbGet = async (storeName, key) => {
        const db = await openStudioDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, 'readonly');
          const store = tx.objectStore(storeName);
          const req = store.get(key);
          req.onsuccess = () => resolve(req.result || null);
          req.onerror = () => reject(req.error);
        });
      };

      const idbPut = async (storeName, item) => {
        const db = await openStudioDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          const req = store.put(item);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      };

      const idbDelete = async (storeName, key) => {
        const db = await openStudioDB();
        return new Promise((resolve, reject) => {
          const tx = db.transaction(storeName, 'readwrite');
          const store = tx.objectStore(storeName);
          const req = store.delete(key);
          req.onsuccess = () => resolve(true);
          req.onerror = () => reject(req.error);
        });
      };

      // --- DOĞRUDAN GPU/DOM REFLERİ (60 FPS Sıfır React Re-render İçin) ---
      const simTimeRef = useRef(0);
      const reqRef = useRef();
      const previousTimeRef = useRef();
      const timelineTrackRef = useRef(null);
      const yearColRefs = useRef({});
      const rowRefs = useRef({});
      const barRefs = useRef({});
      const avatarRefs = useRef({});
      const scoreRefs = useRef({});
      const scrubberRef = useRef(null);
      const percentLabelRef = useRef(null);
      const activeYearLabelRef = useRef(null);
      const isInitialLoadDoneRef = useRef(false);
      const renderYRef = useRef({});
      const renderDtRef = useRef(0);

      // İlk açılışta IndexedDB'den kayıtlı ayarları (presets) ve son aktif çalışma alanını (workspace) yükle
      useEffect(() => {
        if (RENDER_MODE) {
          loadConfig(window.__RENDER_CONFIG__);
          setTimeout(() => { window.__configLoaded = true; }, 300);
          return;
        }
        let isMounted = true;
        const initIndexedDB = async () => {
          try {
            const dbPresets = await idbGetAll(STORE_PRESETS);

            let mergedPresets = [...dbPresets];
            try {
              const localRaw = localStorage.getItem('barChartSettings');
              if (localRaw) {
                const localParsed = JSON.parse(localRaw);
                if (Array.isArray(localParsed)) {
                  for (const lp of localParsed) {
                    if (lp && lp.id && !mergedPresets.some(p => p.id === lp.id)) {
                      await idbPut(STORE_PRESETS, lp);
                      mergedPresets.push(lp);
                    }
                  }
                }
              }
            } catch (e) {}

            if (isMounted && mergedPresets.length > 0) {
              mergedPresets.sort((a, b) => Number(a.id) - Number(b.id));
              setSavedSettings(mergedPresets);
            }

            const lastWorkspace = await idbGet(STORE_WORKSPACE, 'active_workspace');
            if (isMounted && lastWorkspace && lastWorkspace.config) {
              loadConfig(lastWorkspace.config);
            }

            if (isMounted) {
              isInitialLoadDoneRef.current = true;
              setIdbStatus('IndexedDB Aktif');
            }
          } catch (err) {
            if (isMounted) {
              isInitialLoadDoneRef.current = true;
              setIdbStatus('Yerel Bellek (Fallback)');
            }
          }
        };

        initIndexedDB();
        return () => { isMounted = false; };
      }, []);

      useEffect(() => {
        try {
          localStorage.setItem('barChartSettings', JSON.stringify(savedSettings));
        } catch (e) {}
      }, [savedSettings]);

      const blobUrlToDataUrl = async (url) => {
        if (!url || typeof url !== 'string' || !url.startsWith('blob:')) return String(url || '');
        try {
          const response = await fetch(url);
          const blob = await response.blob();
          return await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(String(reader.result || url));
            reader.onerror = () => resolve(url);
            reader.readAsDataURL(blob);
          });
        } catch (e) {
          return url;
        }
      };

      const getCurrentConfig = async () => {
        const clonedPlayers = {};
        for (const pid of Object.keys(players)) {
          const p = players[pid] || {};
          clonedPlayers[pid] = {
            ...p,
            name: p.name || '',
            searchName: p.searchName || p.name || '',
            color: p.color || '#2563eb',
            logo: await blobUrlToDataUrl(p.logo ? String(p.logo).trim() : ''),
            image: await blobUrlToDataUrl(p.image ? String(p.image).trim() : '')
          };
        }

        const clonedStatsData = statsData.map(row => ({ ...row }));
        const savedYearImageUrl = await blobUrlToDataUrl(yearImage ? String(yearImage).trim() : '');
        const savedBgMediaUrl = await blobUrlToDataUrl(bgMedia ? String(bgMedia).trim() : '');

        return {
          headerTitle, headerSubtitle, duration, transitionSpeed, barScale,
          maxPlayers, uiScale, verticalGap, globalShiftX, globalShiftY,
          lLineHorizontalExtension, lLineVerticalExtension, lLineOpacity, lShadowOpacity,
          showImg1, logoSize, logoX, logoRadius,
          showImg2, profileSize, profileX, profileRadius, profilePopout,
          isDynamicBar, barBaseWidth, barHeightSet, barSpacing, scoreSize, scoreColor,
          lineThickness, lineColor, lineOpacity,
          bubbleBgColor, bubbleTextColor, bubbleWidth, bubbleHeight, bubbleFontSize, bubbleBaseOpacity,
          yearBgColor, yearTextColor, yearBgOpacity, yearBorderRadius,
          yearImage: savedYearImageUrl,
          yearImgSize, yearImgPos, yearImgGap, yearImgShiftX, yearImgShiftY, yearFontSize, yearPaddingX, yearPaddingY,
          bgType, bgColor1, bgColor2,
          bgMedia: savedBgMediaUrl,
          bgMediaType,
          aiPrompt, apiKey,
          players: clonedPlayers,
          statsData: clonedStatsData
        };
      };

      // Otomatik Oturum Koruma
      useEffect(() => {
        if (RENDER_MODE || !isInitialLoadDoneRef.current) return;
        const timer = setTimeout(async () => {
          try {
            const currentConf = await getCurrentConfig();
            await idbPut(STORE_WORKSPACE, {
              id: 'active_workspace',
              updatedAt: Date.now(),
              config: currentConf
            });
          } catch (e) {}
        }, 500);
        return () => clearTimeout(timer);
      }, [
        headerTitle, headerSubtitle, duration, transitionSpeed, barScale,
        maxPlayers, uiScale, verticalGap, globalShiftX, globalShiftY,
        lLineHorizontalExtension, lLineVerticalExtension, lLineOpacity, lShadowOpacity,
        showImg1, logoSize, logoX, logoRadius,
        showImg2, profileSize, profileX, profileRadius, profilePopout,
        isDynamicBar, barBaseWidth, barHeightSet, barSpacing, scoreSize, scoreColor,
        lineThickness, lineColor, lineOpacity,
        bubbleBgColor, bubbleTextColor, bubbleWidth, bubbleHeight, bubbleFontSize, bubbleBaseOpacity,
        yearBgColor, yearTextColor, yearBgOpacity, yearBorderRadius,
        yearImage, yearImgSize, yearImgPos, yearImgGap, yearImgShiftX, yearImgShiftY, yearFontSize, yearPaddingX, yearPaddingY,
        bgType, bgColor1, bgColor2, bgMedia, bgMediaType,
        aiPrompt, apiKey, players, statsData
      ]);

      const saveCurrentConfig = async () => {
        if (!saveName.trim()) return;
        const fullConfig = await getCurrentConfig();
        const newConfig = { id: Date.now().toString(), name: saveName.trim(), config: fullConfig };
        try {
          await idbPut(STORE_PRESETS, newConfig);
        } catch (e) {}
        setSavedSettings(prev => [...prev, newConfig]);
        setShowSavePopup(false);
        setSaveName('');
      };

      const updateSavedConfig = async (id) => {
        const fullConfig = await getCurrentConfig();
        const existing = savedSettings.find(item => item.id === id);
        const updatedItem = { id, name: existing ? existing.name : 'Kayıt', config: fullConfig };
        try {
          await idbPut(STORE_PRESETS, updatedItem);
        } catch (e) {}
        setSavedSettings(prev => prev.map(item => item.id === id ? updatedItem : item));
      };

      const loadConfig = (conf) => {
        if (!conf) return;
        if (conf.headerTitle !== undefined) setHeaderTitle(conf.headerTitle);
        if (conf.headerSubtitle !== undefined) setHeaderSubtitle(conf.headerSubtitle);
        if (conf.duration !== undefined) setDuration(conf.duration);
        if (conf.transitionSpeed !== undefined) setTransitionSpeed(conf.transitionSpeed);
        if (conf.barScale !== undefined) setBarScale(conf.barScale);
        if (conf.maxPlayers !== undefined) setMaxPlayers(conf.maxPlayers);
        if (conf.uiScale !== undefined) setUiScale(conf.uiScale);
        if (conf.verticalGap !== undefined) setVerticalGap(conf.verticalGap);
        if (conf.globalShiftX !== undefined) setGlobalShiftX(conf.globalShiftX);
        if (conf.globalShiftY !== undefined) setGlobalShiftY(conf.globalShiftY);
        if (conf.lLineHorizontalExtension !== undefined) setLLineHorizontalExtension(conf.lLineHorizontalExtension);
        if (conf.lLineVerticalExtension !== undefined) setLLineVerticalExtension(conf.lLineVerticalExtension);
        if (conf.lLineOpacity !== undefined) setLLineOpacity(conf.lLineOpacity);
        if (conf.lShadowOpacity !== undefined) setLShadowOpacity(conf.lShadowOpacity);
        if (conf.showImg1 !== undefined) setShowImg1(conf.showImg1);
        if (conf.logoSize !== undefined) setLogoSize(conf.logoSize);
        if (conf.logoX !== undefined) setLogoX(conf.logoX);
        if (conf.logoRadius !== undefined) setLogoRadius(conf.logoRadius);
        if (conf.showImg2 !== undefined) setShowImg2(conf.showImg2);
        if (conf.profileSize !== undefined) setProfileSize(conf.profileSize);
        if (conf.profileX !== undefined) setProfileX(conf.profileX);
        if (conf.profileRadius !== undefined) setProfileRadius(conf.profileRadius);
        if (conf.profilePopout !== undefined) setProfilePopout(conf.profilePopout);
        if (conf.isDynamicBar !== undefined) setIsDynamicBar(conf.isDynamicBar);
        if (conf.barBaseWidth !== undefined) setBarBaseWidth(conf.barBaseWidth);
        if (conf.barHeightSet !== undefined) setBarHeightSet(conf.barHeightSet);
        if (conf.barSpacing !== undefined) setBarSpacing(conf.barSpacing);
        if (conf.scoreSize !== undefined) setScoreSize(conf.scoreSize);
        if (conf.scoreColor !== undefined) setScoreColor(conf.scoreColor);
        if (conf.lineThickness !== undefined) setLineThickness(conf.lineThickness);
        if (conf.lineColor !== undefined) setLineColor(conf.lineColor);
        if (conf.lineOpacity !== undefined) setLineOpacity(conf.lineOpacity);
        if (conf.bubbleBgColor !== undefined) setBubbleBgColor(conf.bubbleBgColor);
        if (conf.bubbleTextColor !== undefined) setBubbleTextColor(conf.bubbleTextColor);
        if (conf.bubbleWidth !== undefined) setBubbleWidth(conf.bubbleWidth);
        if (conf.bubbleHeight !== undefined) setBubbleHeight(conf.bubbleHeight);
        if (conf.bubbleFontSize !== undefined) setBubbleFontSize(conf.bubbleFontSize);
        if (conf.bubbleBaseOpacity !== undefined) setBubbleBaseOpacity(conf.bubbleBaseOpacity);
        if (conf.yearBgColor !== undefined) setYearBgColor(conf.yearBgColor);
        if (conf.yearTextColor !== undefined) setYearTextColor(conf.yearTextColor);
        if (conf.yearBgOpacity !== undefined) setYearBgOpacity(conf.yearBgOpacity);
        if (conf.yearBorderRadius !== undefined) setYearBorderRadius(conf.yearBorderRadius);
        if (conf.yearImage !== undefined) setYearImage(String(conf.yearImage || ''));
        if (conf.yearImgSize !== undefined) setYearImgSize(conf.yearImgSize);
        else if (conf.yearImgWidth !== undefined) setYearImgSize(conf.yearImgWidth);
        if (conf.yearImgPos !== undefined) setYearImgPos(conf.yearImgPos);
        if (conf.yearImgGap !== undefined) setYearImgGap(conf.yearImgGap);
        if (conf.yearImgShiftX !== undefined) setYearImgShiftX(conf.yearImgShiftX);
        if (conf.yearImgShiftY !== undefined) setYearImgShiftY(conf.yearImgShiftY);
        if (conf.yearFontSize !== undefined) setYearFontSize(conf.yearFontSize);
        if (conf.yearPaddingX !== undefined) setYearPaddingX(conf.yearPaddingX);
        if (conf.yearPaddingY !== undefined) setYearPaddingY(conf.yearPaddingY);
        if (conf.bgType !== undefined) setBgType(conf.bgType);
        if (conf.bgColor1 !== undefined) setBgColor1(conf.bgColor1);
        if (conf.bgColor2 !== undefined) setBgColor2(conf.bgColor2);
        if (conf.bgMedia !== undefined) setBgMedia(String(conf.bgMedia || ''));
        if (conf.bgMediaType !== undefined) setBgMediaType(conf.bgMediaType);
        if (conf.aiPrompt !== undefined) setAiPrompt(conf.aiPrompt);
        if (conf.apiKey !== undefined) setApiKey(conf.apiKey);
        if (conf.players !== undefined) {
          const loadedPlayers = {};
          Object.keys(conf.players).forEach(pid => {
            const p = conf.players[pid] || {};
            loadedPlayers[pid] = {
              ...p,
              logo: String(p.logo || ''),
              image: String(p.image || '')
            };
          });
          setPlayers(loadedPlayers);
        }
        if (conf.statsData !== undefined) {
          setStatsData(conf.statsData.map(row => ({ ...row })));
        }
        simTimeRef.current = 0;
        setSimTime(0);
        setIsPlaying(false);
      };

      const handleDeleteSetting = async (id) => {
        try {
          await idbDelete(STORE_PRESETS, id);
        } catch (e) {}
        setSavedSettings(prev => prev.filter(s => s.id !== id));
      };

      const exportPresetsToJson = () => {
        const dataStr = JSON.stringify(savedSettings, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `bar-chart-ayarlar-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const importPresetsFromJson = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const imported = JSON.parse(String(ev.target.result || '[]'));
            if (Array.isArray(imported)) {
              for (const item of imported) {
                if (item && item.id && item.config) {
                  await idbPut(STORE_PRESETS, item);
                }
              }
              const allFromDb = await idbGetAll(STORE_PRESETS);
              allFromDb.sort((a, b) => Number(a.id) - Number(b.id));
              setSavedSettings(allFromDb);
            }
          } catch (err) {}
        };
        reader.readAsText(file);
      };

      const labelClass = "block text-[12px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider";
      const inputClass = "w-full p-2.5 bg-slate-950 border border-slate-700/80 rounded-lg text-sm text-slate-100 placeholder-slate-600 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all";
      const smallInputClass = "w-full p-2 bg-slate-950 border border-slate-700/80 rounded-md text-sm text-slate-100 placeholder-slate-600 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none transition-all";
      const cardClass = "bg-slate-800/40 border border-slate-700/50 p-5 rounded-2xl shadow-sm hover:bg-slate-800/60 transition-colors";
      const sectionTitleClass = "text-sm font-black text-slate-200 mb-5 flex items-center gap-2 border-b border-slate-700/80 pb-3";

      const hexToRgb = (hex) => {
        const h = hex.replace('#', '');
        if (h.length !== 6) return '255, 255, 255';
        return `${parseInt(h.substring(0, 2), 16)}, ${parseInt(h.substring(2, 4), 16)}, ${parseInt(h.substring(4, 6), 16)}`;
      };

      const handleLocalImageUpload = (e, callback) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            if (reader.result) callback(String(reader.result));
          };
          reader.readAsDataURL(file);
        }
      };

      const handleLocalMediaUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const isVid = file.type.startsWith('video/');
          setBgMediaType(isVid ? 'video' : 'image');
          if (isVid) {
            setBgMedia(URL.createObjectURL(file));
          } else {
            const reader = new FileReader();
            reader.onloadend = () => {
              if (reader.result) setBgMedia(String(reader.result));

            reader.readAsDataURL(file);

      };

      // --- TRANSFERMARKT + WIKIPEDIA / THESPORTSDB YEDEKLİ GÖRSEL ÇEKİCİ ---
      const fetchTransfermarktAssets = async (queryName, preferFlag = false) => {
        if (!queryName) return null;
        let image = null;
        let logo = null;

        const searchUrl = `https://www.transfermarkt.com.tr/schnellsuche/ergebnis/schnellsuche?query=${encodeURIComponent(queryName)}`;
        const proxies = [
          `https://corsproxy.io/?${encodeURIComponent(searchUrl)}`,
          `https://api.allorigins.win/raw?url=${encodeURIComponent(searchUrl)}`
        ];

        for (const proxyUrl of proxies) {
          try {
            const res = await fetch(proxyUrl);
            if (!res.ok) continue;
            const html = await res.text();
            const doc = new DOMParser().parseFromString(html, 'text/html');

            const portraitImg = doc.querySelector('img[src*="portrait/"], img.bilderrahmen-fixed');
            if (portraitImg) {
              const rawImg = portraitImg.getAttribute('src') || portraitImg.getAttribute('data-src') || '';
              if (rawImg && !rawImg.includes('default.jpg')) {
                image = rawImg.replace('/small/', '/header/').replace('/medium/', '/header/');
              }

              const row = portraitImg.closest('tr');
              if (row) {
                if (preferFlag) {
                  const flagImg = row.querySelector('img[src*="/images/flagge/"]');
                  if (flagImg) {
                    const rawFlag = flagImg.getAttribute('src') || '';
                    logo = rawFlag.replace('/tiny/', '/head/').replace('/verysmall/', '/head/').replace('/small/', '/head/');
                  }
                }
                if (!logo) {
                  const clubImg = row.querySelector('img[src*="/images/wappen/"]');
                  if (clubImg) {
                    const rawLogo = clubImg.getAttribute('src') || '';
                    logo = rawLogo.replace('/tiny/', '/head/').replace('/verysmall/', '/head/').replace('/small/', '/head/');
                  }
                }
              }
            }
            if (image) break;
          } catch (e) {}
        }

        if (!image) {
          try {
            const tsdbRes = await fetch(`https://www.thesportsdb.com/api/v1/json/3/searchplayers.php?p=${encodeURIComponent(queryName)}`);
            if (tsdbRes.ok) {
              const tsdbData = await tsdbRes.json();
              const playerHit = tsdbData?.player?.[0];
              if (playerHit) {
                image = playerHit.strCutout || playerHit.strThumb || null;
              }
            }
          } catch (e) {}
        }

        if (!image) {
          try {
            const wikiRes = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(queryName)}`);
            if (wikiRes.ok) {
              const wikiData = await wikiRes.json();
              if (wikiData?.thumbnail?.source) {
                image = wikiData.thumbnail.source;
              }
            }
          } catch (e) {}
        }

        if (image || logo) return { image, logo };
        return null;
      };

      const enrichPlayersWithTransfermarkt = async (playersObj, promptStr = '') => {
        const updatedPlayers = { ...playersObj };
        const preferFlag = /bayrak|ülke|milli/i.test(promptStr);

        await Promise.all(
          Object.keys(updatedPlayers).map(async (pid) => {
            const p = updatedPlayers[pid];
            const tmAssets = await fetchTransfermarktAssets(p.searchName || p.name, preferFlag);
            if (tmAssets) {
              if (tmAssets.image) updatedPlayers[pid].image = tmAssets.image;
              if (tmAssets.logo && !(preferFlag && p.logo && p.logo.includes('flagcdn.com'))) {
                updatedPlayers[pid].logo = tmAssets.logo;
              }
            }
          })
        );
        return updatedPlayers;
      };

      // --- AI VERİ ÇEKME FONKSİYONU ---
      const handleAiGenerate = async () => {
        if (!aiPrompt.trim()) {
          setAiError('Lütfen kutucuğa bir konu veya veri isteği yazın.');
          setTimeout(() => setAiError(''), 3000);
          return;
        }

        setIsAiLoading(true);
        setAiError('');
        setAiResultMsg('');

        const runDemoFallback = async (reasonMsg) => {
          const demoPlayers = {
            p1: { name: 'Messi', searchName: 'Lionel Messi', logo: 'https://flagcdn.com/w160/ar.png', image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/b/b4/Lionel-Messi-Argentina-2022-FIFA-World-Cup_%28cropped%29.jpg/800px-Lionel-Messi-Argentina-2022-FIFA-World-Cup_%28cropped%29.jpg', color: '#2563eb' },
            p2: { name: 'Ronaldo', searchName: 'Cristiano Ronaldo', logo: 'https://flagcdn.com/w160/pt.png', image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/d/d7/Cristiano_Ronaldo_playing_for_Al_Nassr_FC_against_Persepolis%2C_September_2023_%28cropped%29.jpg/800px-Cristiano_Ronaldo_playing_for_Al_Nassr_FC_against_Persepolis%2C_September_2023_%28cropped%29.jpg', color: '#dc2626' },
            p3: { name: 'Mbappe', searchName: 'Kylian Mbappe', logo: 'https://flagcdn.com/w160/fr.png', image: 'https://upload.wikimedia.org/wikipedia/commons/thumb/5/57/2019-07-17_SG_Dynamo_Dresden_vs._Paris_Saint-Germain_by_Sandro_Halank%E2%80%93129_%28cropped%29.jpg/800px-2019-07-17_SG_Dynamo_Dresden_vs._Paris_Saint-Germain_by_Sandro_Halank%E2%80%93129_%28cropped%29.jpg', color: '#0284c7' },
            p4: { name: 'Haaland', searchName: 'Erling Haaland', logo: 'https://flagcdn.com/w160/no.png', image: 'https://img.a.transfermarkt.technology/portrait/header/418560-1709108116.png?lm=1', color: '#eab308' }
          };
          const enrichedDemo = await enrichPlayersWithTransfermarkt(demoPlayers, aiPrompt);
          setPlayers(enrichedDemo);
          setMaxPlayers(Object.keys(enrichedDemo).length);
          setStatsData([
            { label: '2020', p1: 31, p2: 37, p3: 27, p4: 33 },
            { label: '2021', p1: 38, p2: 36, p3: 42, p4: 41 },
            { label: '2022', p1: 35, p2: 24, p3: 54, p4: 43 },
            { label: '2023', p1: 28, p2: 54, p3: 52, p4: 52 },
            { label: '2024', p1: 30, p2: 43, p3: 44, p4: 38 },
            { label: '2025', p1: 26, p2: 39, p3: 48, p4: 42 },
            { label: '2026', p1: 25, p2: 35, p3: 50, p4: 45 }
          ]);
          simTimeRef.current = 0;
          setSimTime(0);
          setIsPlaying(false);
          setIsAiLoading(false);
          setHeaderTitle("DÜNYA FUTBOLU");
          setHeaderSubtitle("SON 7 YILIN İSTATİSTİKLERİ");
          setAiResultMsg(reasonMsg);
          setTimeout(() => setAiResultMsg(''), 6000);
        };

        if (!apiKey.trim()) {
          await runDemoFallback("🔑 Demo verileri (4 oyuncu, 7 yıl) ve Transfermarkt görselleri yüklendi.");
          return;
        }

        const promptText = `Sen bir Bar Chart Race veri üretecek JSON API'sisin. SADECE GEÇERLİ BİR JSON DÖNDÜR. Markdown veya \`\`\` kullanma. 
        Kullanıcı İsteği: "${aiPrompt}". 
        Eğer kullanıcı kaç oyuncu istediğini belirtmediyse VARSAYILAN OLARAK 4 OYUNCU üret. Eğer kaç yıl istediğini belirtmediyse VARSAYILAN OLARAK 7 YIL üret.
        Oyuncuların kısa görünen isimlerini (name), tam isimlerini (searchName), ülke bayrağı istenmişse https://flagcdn.com/w160/{2_harfli_ulke_kodu}.png formatında logo URL'lerini, kulüp logosu istenmişse Transfermarkt kulüp logosu URL'lerini (https://tmssl.akamaized.net/images/wappen/head/{kulup_id}.png formatında) ve Transfermarkt oyuncu portre URL'lerini (https://img.a.transfermarkt.technology/portrait/header/... formatında), renklerini (#hex formatında) ve zaman çizelgesindeki ARTIŞ skorlarını üret.
        
        Beklenen Format (Örnek):
        {
          "headerTitle": "ANA BAŞLIK",
          "headerSubtitle": "ALT BAŞLIK",
          "players": {
            "p1": {"name": "Messi", "searchName": "Lionel Messi", "logo": "https://flagcdn.com/w160/ar.png", "image": "https://img.a.transfermarkt.technology/portrait/header/28003-1710080339.jpg?lm=1", "color": "#2563eb"},
            "p2": {"name": "Ronaldo", "searchName": "Cristiano Ronaldo", "logo": "https://flagcdn.com/w160/pt.png", "image": "https://img.a.transfermarkt.technology/portrait/header/8198-1694609670.jpg?lm=1", "color": "#e11d48"}
          },
          "statsData": [
            {"label": "2020", "p1": 30, "p2": 35},
            {"label": "2021", "p1": 38, "p2": 32}
          ]
        }
        Not: İlk yıldan itibaren tüm satırlara gerçek artış (increment) verilerini yaz, 0 değerli başlangıç satırı ekleme.`;

        try {
          let response = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-goog-api-key': apiKey.trim()
            },
            body: JSON.stringify({
              contents: [{ parts: [{ text: promptText }] }]
            })
          });

          if (!response.ok) {
            const fallbackKey = "";
            response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${fallbackKey}`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                contents: [{ parts: [{ text: promptText }] }]
              })
            });
          }

          const data = await response.json();
          if (data.error) throw new Error(data.error.message || "API Hatası");

          let text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
          text = text.replace(/```json/gi, '').replace(/```/g, '').trim();

          const parsedData = JSON.parse(text);

          if (parsedData.players && parsedData.statsData) {
            setAiResultMsg("🔄 Veriler alındı, Transfermarkt / Wikipedia üzerinden yüksek çözünürlüklü görseller çekiliyor...");
            const tmEnrichedPlayers = await enrichPlayersWithTransfermarkt(parsedData.players, aiPrompt);

            if (parsedData.headerTitle) setHeaderTitle(parsedData.headerTitle);
            if (parsedData.headerSubtitle) setHeaderSubtitle(parsedData.headerSubtitle);
            setPlayers(tmEnrichedPlayers);
            setMaxPlayers(Math.max(4, Object.keys(tmEnrichedPlayers).length));
            setStatsData(parsedData.statsData);
            simTimeRef.current = 0;
            setSimTime(0);
            setIsPlaying(false);
            setAiResultMsg("✨ Yapay Zeka verileri ve görseller başarıyla yüklendi!");
            setTimeout(() => setAiResultMsg(''), 5000);
          } else {
            throw new Error("Yapay Zeka doğru formata uymadı. Lütfen tekrar deneyin.");
          }
        } catch (err) {
          setAiError("Hata Oluştu: " + err.message);
          setTimeout(() => setAiError(''), 5000);
        } finally {
          setIsAiLoading(false);
        }
      };

      const handleAddPlayer = () => {
        const currentIds = Object.keys(players).map(k => parseInt(k.substring(1))).filter(n => !isNaN(n));
        const nextIdNum = currentIds.length > 0 ? Math.max(...currentIds) + 1 : 1;
        const newId = `p${nextIdNum}`;
        const randomColor = `hsl(${(nextIdNum * 137) % 360}, 70%, 50%)`;
        setPlayers(prev => ({ ...prev, [newId]: { name: `Oyuncu ${nextIdNum}`, logo: '', image: '', color: randomColor } }));
        setStatsData(prev => prev.map(row => ({ ...row, [newId]: 0 })));
        setMaxPlayers(prev => Math.max(prev, Object.keys(players).length + 1));
      };

      const handleRemovePlayer = (idToRemove) => {
        if (Object.keys(players).length <= 1) {
          setAiError("En az 1 oyuncu kalmalıdır.");
          setTimeout(() => setAiError(''), 3000);
          return;
        }
        const newPlayers = { ...players };
        delete newPlayers[idToRemove];
        setPlayers(newPlayers);
        setStatsData(prev => prev.map(row => { const newRow = { ...row }; delete newRow[idToRemove]; return newRow; }));
      };

      const cumulativeData = useMemo(() => {
        const res = [];
        statsData.forEach((row, idx) => {
          const newRow = { label: row.label };
          Object.keys(players).forEach(pid => {
            if (idx === 0) newRow[pid] = Number(row[pid]) || 0;
            else newRow[pid] = res[idx - 1][pid] + (Number(row[pid]) || 0);
          });
          res.push(newRow);
        });
        return res;
      }, [statsData, players]);

      const allRanks = useMemo(() => {
        return cumulativeData.map(row => {
          const scoresArr = Object.keys(players).map(id => ({ id, score: Number(row[id]) || 0 }));
          scoresArr.sort((a, b) => b.score - a.score || a.id.localeCompare(b.id));
          const ranks = {};
          scoresArr.forEach((item, index) => { ranks[item.id] = index; });
          return ranks;
        });
      }, [cumulativeData, players]);

      const initialRanks = useMemo(() => {
        const scoresArr = Object.keys(players).map(id => ({ id, score: 0 }));
        scoresArr.sort((a, b) => b.score - a.score || a.id.localeCompare(b.id));
        const ranks = {};
        scoresArr.forEach((item, index) => { ranks[item.id] = index; });
        return ranks;
      }, [players]);

      const globalMaxScore = useMemo(() => {
        let max = 0.0001;
        cumulativeData.forEach(row => {
          Object.keys(players).forEach(pid => {
            if (row[pid] > max) max = row[pid];
          });
        });
        return max;
      }, [cumulativeData, players]);

      const rowHeight = (barHeightSet + barSpacing) * uiScale;
      const safeAreaY = 100;
      const maxAllowedHeight = 640 - safeAreaY - 40 - (2 * verticalGap) - 36;
      const actualMaxPlayers = Math.min(
        Object.keys(players).length,
        maxPlayers,
        Math.max(1, Math.floor(maxAllowedHeight / rowHeight))
      );
      const listHeight = actualMaxPlayers * rowHeight;
      const listStartY = safeAreaY + ((640 - safeAreaY) - listHeight) / 2;

      const lLineTop = listStartY - verticalGap;
      const baseLLineHeight = listHeight + (2 * verticalGap);

      const lLineHeight = baseLLineHeight + lLineVerticalExtension;
      const lLineHorizontalWidth = 249 + lLineHorizontalExtension;

      const barStartX = 97;
      const safeRightMargin = 15;
      const scaledImg2Width = profileSize * uiScale;
      const nameTagSpace = 20 * uiScale;
      const imgSpaceNeeded = 2.5 + profileX + scaledImg2Width + nameTagSpace;
      const maxAllowedScaledBarWidth = 360 - barStartX - imgSpaceNeeded - safeRightMargin;
      const calculatedMaxBarWidth = Math.max(barBaseWidth + 5, maxAllowedScaledBarWidth / uiScale);
      const clipLeftX = 94;

      // --- DOĞRUDAN GPU/DOM GÜNCELLEYİCİ ---
      const updateSimulationDOM = (t) => {
        const totalSteps = statsData.length;
        const clampedT = Math.max(0, Math.min(t, totalSteps));
        const currentIndex = Math.floor(clampedT);
        const progress = clampedT - currentIndex;

        if (scrubberRef.current) {
          scrubberRef.current.value = clampedT;
        }
        if (percentLabelRef.current) {
          const pct = Math.round((clampedT / Math.max(1, totalSteps)) * 100);
          percentLabelRef.current.textContent = `%${pct}`;
        }
        if (activeYearLabelRef.current) {
          const activeRow = statsData[Math.min(currentIndex, Math.max(0, totalSteps - 1))] || statsData[0];
          activeYearLabelRef.current.textContent = `📅 ${activeRow?.label || '-'}`;
        }

        if (timelineTrackRef.current) {
          const offsetX = -clampedT * barScale;
          timelineTrackRef.current.style.transform = `translate3d(${offsetX}px, 0, 0)`;
        }

        statsData.forEach((_, idx) => {
          const colEl = yearColRefs.current[idx];
          if (!colEl) return;
          const distFromLLine = ((idx + 1) - clampedT) * barScale;
          let colOpacity = 1;
          if (distFromLLine <= 4) {
            colOpacity = 0;
          } else if (distFromLLine < 52) {
            const raw = (distFromLLine - 4) / 48;
            colOpacity = raw * raw * (3 - 2 * raw);
          }
          colEl.style.opacity = colOpacity;
        });

        const currentScores = {};
        Object.keys(players).forEach(id => {
          if (clampedT >= totalSteps) {
            const lastRow = cumulativeData[cumulativeData.length - 1];
            currentScores[id] = lastRow ? (Number(lastRow[id]) || 0) : 0;
          } else {
            const prevRow = currentIndex === 0 ? null : cumulativeData[currentIndex - 1];
            const nextRow = cumulativeData[currentIndex] || cumulativeData[0];
            const cVal = prevRow ? (Number(prevRow[id]) || 0) : 0;
            const nVal = nextRow ? (Number(nextRow[id]) || 0) : 0;
            let displayProgress = 0;
            if (progress > 0.70) {
              const rawP = Math.min(1, (progress - 0.70) / 0.30);
              displayProgress = 1 - Math.pow(1 - rawP, 3);
            }
            currentScores[id] = cVal + (nVal - cVal) * displayProgress;
          }
        });

        const scoresArr = Object.keys(currentScores).map(id => ({ id, score: currentScores[id] }));
        scoresArr.sort((a, b) => b.score - a.score || a.id.localeCompare(b.id));
        const currentRanks = {};
        scoresArr.forEach((item, index) => { currentRanks[item.id] = index; });

        Object.keys(players).forEach(id => {
          const score = currentScores[id];
          const rank = currentRanks[id];
          let yPos = rank * rowHeight;
          if (RENDER_MODE) {
            // CSS transitions don't advance under frame stepping, so ease row swaps manually
            const prevY = renderYRef.current[id];
            const dt = renderDtRef.current;
            if (prevY !== undefined) {
              if (dt <= 0) {
                yPos = prevY;
              } else {
                const tau = Math.max(1, (transitionSpeed * 1000) / 4);
                yPos = prevY + (yPos - prevY) * (1 - Math.exp(-dt / tau));
              }
            }
            renderYRef.current[id] = yPos;
          }
          const rowOp = rank >= actualMaxPlayers ? 0 : 1;

          const rowEl = rowRefs.current[id];
          if (rowEl) {
            rowEl.style.transform = `translate3d(0, ${yPos}px, 0)`;
            rowEl.style.opacity = rowOp;
          }

          let dynBarWidth = barBaseWidth;
          if (isDynamicBar) {
            const ratio = score / globalMaxScore;
            dynBarWidth = barBaseWidth + (ratio * (calculatedMaxBarWidth - barBaseWidth));
          }
          const scaledBarW = dynBarWidth * uiScale;

          const barEl = barRefs.current[id];
          if (barEl) {
            barEl.style.width = `${scaledBarW + nameTagSpace}px`;
          }

          const avatarEl = avatarRefs.current[id];
          if (avatarEl) {
            const imgLeft = barStartX + scaledBarW + nameTagSpace + 2.5 + profileX;
            avatarEl.style.transform = `translate3d(${imgLeft}px, 0, 0)`;
          }

          const scoreEl = scoreRefs.current[id];
          if (scoreEl) {
            scoreEl.textContent = Math.floor(score);
          }
        });
      };

      useEffect(() => {
        updateSimulationDOM(simTimeRef.current);
        if (RENDER_MODE) {
          window.__steps = statsData.length;
          window.__seek = (t, dtMs) => {
            renderDtRef.current = dtMs;
            simTimeRef.current = t;
            updateSimulationDOM(t);
            renderDtRef.current = 0;
          };
        }
      });

      useEffect(() => {
        const handleKeyDown = (e) => { if (e.key === 'Escape') setIsFullscreen(false); };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, []);

      // --- 60/120 FPS ANİMASYON DÖNGÜSÜ ---
      useEffect(() => {
        if (!isPlaying) {
          if (reqRef.current) cancelAnimationFrame(reqRef.current);
          previousTimeRef.current = undefined;
          return;
        }

        const totalSteps = statsData.length;
        const msPerStep = (duration * 1000) / Math.max(1, totalSteps);

        const stepFrame = (now) => {
          if (previousTimeRef.current !== undefined) {
            const deltaTime = now - previousTimeRef.current;
            const nextTime = simTimeRef.current + (deltaTime / msPerStep);

            if (nextTime >= totalSteps) {
              simTimeRef.current = totalSteps;
              updateSimulationDOM(totalSteps);
              setSimTime(totalSteps);
              setIsPlaying(false);
              return;
            }

            simTimeRef.current = nextTime;
            updateSimulationDOM(nextTime);
          }
          previousTimeRef.current = now;
          reqRef.current = requestAnimationFrame(stepFrame);
        };

        reqRef.current = requestAnimationFrame(stepFrame);
        return () => {
          if (reqRef.current) cancelAnimationFrame(reqRef.current);
        };

              <div className="flex flex-wrap justify-center sm:justify-end gap-2">
                <button onClick={() => setShowSavePopup(true)} className="px-4 py-2 bg-indigo-500/20 text-indigo-400 hover:bg-indigo-500 hover:text-white rounded-lg text-sm font-bold border border-indigo-500/30 transition-all">💾 Ayarı Kaydet</button>
                <button onClick={() => setIsFullscreen(true)} className="px-4 py-2 bg-blue-600 hover:bg-blue-500 rounded-lg text-sm font-bold shadow-lg shadow-blue-500/20 transition-all flex items-center gap-2 text-white">
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" /></svg>
                  <span className="hidden sm:inline">Tam Ekran</span>
                </button>
                <button
                  onClick={() => {
                    setIsPlaying(false);
                    simTimeRef.current = 0;
                    setSimTime(0);
                    updateSimulationDOM(0);
                  }}
                  className="px-5 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-bold text-white transition-colors"
                >
                  Sıfırla
                </button>
                <button
                  onClick={() => {
                    if (!isPlaying && simTimeRef.current >= statsData.length) {
                      simTimeRef.current = 0;
                      setSimTime(0);
                      updateSimulationDOM(0);
                    }
                    if (isPlaying) {
                      setSimTime(simTimeRef.current);
                    }
                    setIsPlaying(!isPlaying);
                  }}
                  className={`px-8 py-2 rounded-lg text-sm font-black text-white transition-all shadow-lg ${isPlaying ? 'bg-red-500 hover:bg-red-400 shadow-red-500/20' : 'bg-emerald-500 hover:bg-emerald-400 shadow-emerald-500/20'}`}
                >
                  {isPlaying ? 'Durdur' : 'Başlat'}
                </button>
              </div>
            </div>

            {/* ZAMAN ÇİZELGESİ KONTROL ÇUBUĞU (SCRUBBER) */}
            <div className="px-5 py-2.5 bg-slate-900/90 border-b border-slate-800 flex items-center gap-4">
              <span ref={activeYearLabelRef} className="text-xs font-black text-blue-400 min-w-[70px] uppercase tracking-wider">
                📅 {statsData[0]?.label || '-'}
              </span>
              <input
                ref={scrubberRef}
                type="range"
                min="0"
                max={Math.max(1, statsData.length)}
                step="0.005"
                defaultValue={0}
                onChange={(e) => {
                  const val = parseFloat(e.target.value);
                  setIsPlaying(false);
                  simTimeRef.current = val;
                  setSimTime(val);
                  updateSimulationDOM(val);
                }}
                className="flex-1 h-1.5 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-blue-500"
              />
              <span ref={percentLabelRef} className="text-[11px] font-bold text-slate-400 tabular-nums min-w-[45px] text-right">
                %0
              </span>
            </div>

            <div className="flex bg-slate-950/50 border-b border-slate-800 px-5 gap-2 overflow-x-auto custom-scrollbar">
              <button onClick={() => setActiveTab('ai')} className={`py-3 px-4 text-sm font-bold border-b-2 transition-colors whitespace-nowrap flex items-center gap-2 ${activeTab === 'ai' ? 'border-purple-500 text-purple-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>✨ Hızlı Dolum (AI)</button>
              <button onClick={() => setActiveTab('genel')} className={`py-3 px-4 text-sm font-bold border-b-2 transition-colors whitespace-nowrap ${activeTab === 'genel' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>⚙️ Genel & Sistem</button>
              <button onClick={() => setActiveTab('gorunum')} className={`py-3 px-4 text-sm font-bold border-b-2 transition-colors whitespace-nowrap ${activeTab === 'gorunum' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>🎨 Görünüm Ayarları</button>
              <button onClick={() => setActiveTab('oyuncular')} className={`py-3 px-4 text-sm font-bold border-b-2 transition-colors whitespace-nowrap ${activeTab === 'oyuncular' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>👤 Oyuncular</button>
              <button onClick={() => setActiveTab('veriler')} className={`py-3 px-4 text-sm font-bold border-b-2 transition-colors whitespace-nowrap ${activeTab === 'veriler' ? 'border-blue-500 text-blue-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>📊 Veri Tablosu</button>
              <button onClick={() => setActiveTab('yonetim')} className={`py-3 px-4 text-sm font-bold border-b-2 transition-colors whitespace-nowrap ${activeTab === 'yonetim' ? 'border-indigo-500 text-indigo-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}>💾 Ayar Yönetimi</button>
            </div>

            <div className="p-5 lg:p-8 overflow-y-auto flex-1 custom-scrollbar">
              {renderTabContent()}
            </div>
          </div>

          {/* SİMÜLASYON DIŞ ÇERÇEVE */}
          <div className={isFullscreen ? "fixed inset-0 z-50 bg-black flex justify-center items-center" : "flex justify-center items-center lg:w-auto w-full bg-slate-900 border border-slate-800 rounded-none p-4 lg:p-6 shadow-2xl relative overflow-hidden"}>
            {isFullscreen && (
              <button onClick={() => setIsFullscreen(false)} className="absolute top-6 right-6 z-[60] bg-white/10 hover:bg-white/20 text-white p-3 rounded-full backdrop-blur-md transition-all group border border-white/20">
                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" /></svg>
                <span className="absolute right-14 top-1/2 -translate-y-1/2 bg-black/80 text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap font-semibold">Çıkış (ESC)</span>
              </button>
            )}

            {/* DİK KÖŞELİ (rounded-none) SİMÜLASYON EKRANI */}
            <div id="stage" className="relative shadow-[0_20px_60px_rgba(0,0,0,0.8)] ring-1 ring-white/10 rounded-none" style={{ ...dynamicStyles, transform: isFullscreen ? 'scale(1.1)' : 'scale(1)', transition: 'transform 0.3s ease' }}>
              {bgMedia && bgMediaType === 'image' && <img src={bgMedia} className="absolute inset-0 w-full h-full object-cover z-0" alt="Background" style={RENDER_MODE ? { filter: 'blur(3px) saturate(1.1)', transform: 'scale(1.05)' } : undefined} />}
              {RENDER_MODE && bgMedia && <div className="absolute inset-0 z-0" style={{ background: `linear-gradient(180deg, ${bgColor2}cc 0%, rgba(2,6,23,0.55) 45%, ${bgColor2}dd 100%)` }}></div>}
              {bgMedia && bgMediaType === 'video' && <video src={bgMedia} autoPlay loop muted className="absolute inset-0 w-full h-full object-cover z-0" />}

              <div className="absolute inset-0 pointer-events-none bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] opacity-40 mix-blend-overlay z-[1]"></div>

              <div className="absolute top-6 left-0 right-0 text-center z-30 flex flex-col items-center px-3">
                <h1 className="text-white/90 text-2xl font-bold tracking-wider uppercase mb-1 drop-shadow-lg">{headerTitle}</h1>
                <h2 className="text-white/50 text-sm font-medium tracking-widest uppercase drop-shadow-md">{headerSubtitle}</h2>
              </div>

              <div className="absolute inset-0 pointer-events-none z-10" style={{ transform: `translate(${globalShiftX}px, ${globalShiftY}px)`, transition: 'transform 0.3s ease-out' }}>
                {/* DİKEY VE YATAY L-ÇİZGİSİ VE BEYAZ GÖLGE (Z-20: Yılların Üstünde) */}
                <div
                  className="absolute border-l-[6px] border-b-[6px] rounded-bl-[16px] pointer-events-none drop-shadow-[0_0_8px_rgba(255,255,255,0.3)] z-20"
                  style={{
                    top: `${lLineTop}px`,
                    height: `${lLineHeight}px`,
                    left: '91px',
                    width: `${lLineHorizontalWidth}px`,
                    borderColor: `rgba(255, 255, 255, ${lLineOpacity})`,
                    background: `linear-gradient(to right, rgba(255, 255, 255, ${lShadowOpacity}) 0%, rgba(255, 255, 255, 0) 100%)`,
                    transition: 'top 0.3s ease, height 0.3s ease, width 0.3s ease'
                  }}
                ></div>

                {/* HAREKET EDEN ZAMAN ÇİZELGESİ VİEWPORT */}
                <div
                  className="absolute top-0 bottom-0 right-0 overflow-hidden z-10 pointer-events-none"
                  style={{ left: `${clipLeftX}px` }}
                >
                  <div
                    ref={timelineTrackRef}
                    className="absolute left-0"
                    style={{
                      top: `${lLineTop}px`,
                      height: `${lLineHeight}px`,
                      transform: 'translate3d(0px, 0, 0)',
                      willChange: 'transform',
                      backfaceVisibility: 'hidden'
                    }}
                  >
                    {memoizedTimelineItems}
                  </div>
                </div>

                {/* OYUNCULAR KAPSAYICISI (Z-30) */}
                <div
                  className="absolute left-0 right-0 z-30 pointer-events-none"
                  style={{ top: `${listStartY}px`, height: `${listHeight}px`, transition: 'top 0.3s ease, height 0.3s ease' }}
                >
                  {Object.keys(players).map((id) => {
                    const player = players[id];
                    const initRank = initialRanks[id] ?? 0;
                    const initY = initRank * rowHeight;
                    const initOpacity = initRank >= actualMaxPlayers ? 0 : 1;

                    const scaledImg1Size = logoSize * uiScale;
                    const logoLeft = 89 - scaledImg1Size + logoX;
                    const scaledBarWidth = barBaseWidth * uiScale;
                    const scaledBarHeight = barHeightSet * uiScale;

                    const scaledImg2Size = profileSize * uiScale;
                    const initImgLeft = barStartX + scaledBarWidth + nameTagSpace + 2.5 + profileX;
                    const scaledScoreSize = scoreSize * uiScale;

                    return (
                      <div
                        key={id}
                        ref={el => { rowRefs.current[id] = el; }}
                        className="absolute left-0 w-full"
                        style={{
                          height: `${rowHeight}px`,
                          transform: `translate3d(0, ${initY}px, 0)`,
                          transition: RENDER_MODE ? 'none' : `transform ${transitionSpeed}s ease-in-out, opacity ${transitionSpeed}s ease`,
                          opacity: initOpacity,
                          willChange: 'transform, opacity'
                        }}
                      >
                        {showImg1 && (
                          <div
                            className="absolute top-1/2 -translate-y-1/2 flex items-center justify-center overflow-hidden bg-slate-900/40"
                            style={{
                              left: `${logoLeft}px`,
                              width: `${scaledImg1Size}px`,
                              height: `${scaledImg1Size}px`,
                              borderRadius: `${logoRadius}%`,
                              border: `${Math.max(2, 3 * uiScale)}px solid rgba(255,255,255,0.95)`,
                              boxShadow: '0 4px 10px rgba(0,0,0,0.3)'
                            }}
                          >
                            <img
                              src={player?.logo || `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%231e293b"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold" font-size="40">${encodeURIComponent(player?.name?.charAt(0) || 'L')}</text></svg>`}
                              alt="Logo"
                              referrerPolicy="no-referrer"
                              className="w-full h-full object-cover"
                              onError={(e) => { e.target.onerror = null; e.target.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%231e293b"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold" font-size="40">${encodeURIComponent(player?.name?.charAt(0) || 'L')}</text></svg>`; }}
                            />
                          </div>
                        )}

                        <div
                          ref={el => { barRefs.current[id] = el; }}
                          className="absolute top-1/2 -translate-y-1/2 rounded-r-[8px] shadow-[0_4px_10px_rgba(0,0,0,0.5)] flex items-stretch z-10 overflow-hidden"
                          style={{
                            left: `${barStartX}px`,
                            width: `${scaledBarWidth + nameTagSpace}px`,
                            height: `${scaledBarHeight}px`,
                            backgroundColor: player?.color || '#000',
                            willChange: 'width'
                          }}
                        >
                          <div className="absolute inset-0 bg-black/10 pointer-events-none"></div>

                          <div
                            className="flex-1 flex justify-center items-center relative z-10"
                            style={{ paddingRight: `${nameTagSpace}px` }}
                          >
                            <span
                              ref={el => { scoreRefs.current[id] = el; }}
                              className="font-extrabold italic leading-none tabular-nums drop-shadow-md"
                              style={{
                                fontFamily: '"Garet", "Garet Heavy", sans-serif',
                                fontWeight: 800,
                                fontStyle: 'italic',
                                fontSize: `${scaledScoreSize}px`,
                                color: scoreColor
                              }}
                            >
                              0
                            </span>
                          </div>

                          <div
                            className="absolute right-0 top-0 bottom-0 bg-white flex justify-center items-center z-20"
                            style={{ width: `${nameTagSpace}px` }}
                          >
                            <span
                              className="font-black whitespace-nowrap text-black"
                              style={{
                                fontFamily: '"Bobby Jones", sans-serif',
                                fontSize: `${globalMinFontSize}px`,
                                transform: 'rotate(-90deg)'
                              }}
                            >
                              {player?.name}
                            </span>
                          </div>
                        </div>

                        {showImg2 && (() => {
                          const extraHeight = scaledImg2Size * (profilePopout / 100);
                          const totalHeight = scaledImg2Size + extraHeight;

                          return (
                            <div
                              ref={el => { avatarRefs.current[id] = el; }}
                              className="absolute left-0 z-20 flex-shrink-0"
                              style={{
                                width: `${scaledImg2Size}px`,
                                height: `${totalHeight}px`,
                                bottom: `calc(50% - ${scaledImg2Size / 2}px)`,
                                transform: `translate3d(${initImgLeft}px, 0, 0)`,
                                willChange: 'transform'
                              }}
                            >
                              <div
                                className="absolute bottom-0 w-full shadow-lg"
                                style={{
                                  height: `${scaledImg2Size}px`,
                                  borderRadius: `${profileRadius}%`,
                                  border: `${Math.max(2, 3 * uiScale)}px solid rgba(255,255,255,0.95)`,
                                  backgroundColor: player?.color || '#1e3a8a',
                                  boxShadow: '0 4px 10px rgba(0,0,0,0.45), inset 0 4px 10px rgba(0,0,0,0.3)',
                                  zIndex: 1
                                }}
                              ></div>

                              <div
                                className="absolute bottom-0 w-full flex justify-center items-end overflow-hidden"
                                style={{
                                  height: `${totalHeight}px`,
                                  zIndex: 2,
                                  borderBottom: `${Math.max(2, 3 * uiScale)}px solid transparent`,
                                  borderLeft: `${Math.max(2, 3 * uiScale)}px solid transparent`,
                                  borderRight: `${Math.max(2, 3 * uiScale)}px solid transparent`,
                                  borderBottomLeftRadius: `${(scaledImg2Size * profileRadius) / 100}px`,
                                  borderBottomRightRadius: `${(scaledImg2Size * profileRadius) / 100}px`
                                }}
                              >
                                <img
                                  src={player?.image || `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%23334155"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold" font-size="45">${encodeURIComponent(player?.name?.charAt(0) || 'P')}</text></svg>`}
                                  alt={player?.name}
                                  referrerPolicy="no-referrer"
                                  className="w-full h-full object-cover"
                                  style={{ objectPosition: 'bottom center' }}
                                  onError={(e) => { e.target.onerror = null; e.target.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="%23334155"/><text x="50%" y="54%" dominant-baseline="middle" text-anchor="middle" fill="white" font-family="sans-serif" font-weight="bold" font-size="45">${encodeURIComponent(player?.name?.charAt(0) || 'P')}</text></svg>`; }}
                                />
                              </div>
                            </div>
                          );
                        })()}

                      </div>
                    );
                  })}
                </div>

              </div>
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
