name: Shorts Factory

on:
  schedule:
    - cron: "0 7 * * *"
    - cron: "0 13 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Belirli bir konu (boş = rastgele)"
        required: false
        default: ""
      privacy:
        description: "YouTube görünürlüğü"
        type: choice
        options: [public, unlisted, private]
        default: public
      skip_upload:
        description: "Sadece video üret, YouTube'a yükleme"
        type: boolean
        default: false
      sample:
        description: "NIM yerine örnek veriyle test et"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: shorts-factory
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NIM_MODEL: ${{ vars.NIM_MODEL }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      CONTENT_LANG: ${{ vars.CONTENT_LANG || 'tr' }}
      INPUT_TOPIC: ${{ inputs.topic }}
      YT_PRIVACY: ${{ inputs.privacy || vars.YT_PRIVACY || 'public' }}
      SKIP_UPLOAD: ${{ inputs.skip_upload || secrets.YT_REFRESH_TOKEN == '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Install dependencies
        timeout-minutes: 10
        run: |
          pip install -r requirements.txt
          python -m playwright install chromium

      - name: Produce short
        timeout-minutes: 25
        run: python factory/main.py ${{ inputs.sample && '--sample' || '' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-${{ github.run_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          meta=$(ls output/*.json | head -1)
          base="${meta%.json}"
          tag="video-$(basename "$base" | cut -c1-15)"
          python - "$meta" > notes.md <<'EOF'
          import json, sys
          m = json.load(open(sys.argv[1], encoding="utf-8"))
          yt = m["youtube"]
          print(f"**{m['headerTitle']}** - {m['headerSubtitle']}\n")
          if m.get("video_id"):
              print(f"YouTube: https://youtube.com/shorts/{m['video_id']}\n")
          print(f"Konu: {m['topic']}\n\n### Açıklama\n{yt['description']}\n\n### Etiketler\n{', '.join(yt['tags'])}")
          EOF
          title=$(python -c "import json,sys;print(json.load(open(sys.argv[1],encoding='utf-8'))['youtube']['title'])" "$meta")
          gh release create "$tag" output/* --title "$title" --notes-file notes.md

      - name: Save history
        if: success()
        run: |
          git config user.name "zeynmedia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --cached --quiet || (git commit -m "history: $(date -u +%F' '%H:%M)" && git pull --rebase -q && git push)
